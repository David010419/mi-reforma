<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f97316">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Mi Reforma">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Mi Reforma · Gestor de obra</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23f97316'/%3E%3Cpath d='M14 30 32 15l18 15v19H14z' fill='none' stroke='white' stroke-width='5' stroke-linejoin='round'/%3E%3Cpath d='M27 49V37h10v12' fill='none' stroke='white' stroke-width='5'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="logo" id="logoIcon"></div>
        <div class="brand-txt">
          <div class="brand-title" id="brandName">Mi Reforma</div>
          <div class="brand-sub">Gestor de obra</div>
        </div>
      </div>
      <nav class="nav" id="mainNav">
        <a href="#resumen" data-view="resumen"><span data-ic="dashboard"></span><b>Resumen</b></a>
        <a href="#tareas" data-view="tareas"><span data-ic="tasks"></span><b>Tareas</b><em class="nav-badge" id="navBadge"></em></a>
        <a href="#gastos" data-view="gastos"><span data-ic="euro"></span><b>Gastos</b></a>
        <a href="#plano" data-view="plano"><span data-ic="plan"></span><b>Planos</b></a>
        <a href="#obra" data-view="obra"><span data-ic="hammer"></span><b>Obra</b></a>
        <a href="#ajustes" data-view="ajustes" class="nav-desk-only"><span data-ic="settings"></span><b>Ajustes</b></a>
      </nav>
      <div class="sidebar-foot">
        <div class="sf-label"><span>Progreso de la obra</span><b id="sfPct">0%</b></div>
        <div class="progress"><i id="sfBar"></i></div>
        <button class="save-ind" id="saveInd" title="Estado de guardado y sincronización">Guardado en este navegador</button>
      </div>
    </aside>

    <div class="mobile-bar" id="mobileBar">
      <div class="mb-brand">
        <span class="mb-logo" id="mbLogoIcon"></span>
        <b id="mbTitle">Mi Reforma</b>
      </div>
      <div class="mb-actions">
        <button class="mb-sync" id="mbSync" title="Estado de sincronización"></button>
        <a class="icon-btn sm" href="#ajustes" id="mbSettings" title="Ajustes"></a>
      </div>
    </div>

    <main class="main">
      <section class="view" id="view-resumen"></section>
      <section class="view" id="view-tareas"></section>
      <section class="view" id="view-gastos"></section>
      <section class="view" id="view-plano"></section>
      <section class="view" id="view-obra"></section>
      <section class="view" id="view-ajustes"></section>
    </main>
  </div>

  <div id="drawerBackdrop" class="backdrop"></div>
  <aside id="drawer" class="drawer" aria-hidden="true"></aside>
  <div id="modalRoot" class="modal-root" aria-hidden="true"></div>
  <div id="toasts"></div>

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" defer></script>
  <script src="js/vendor/three.min.js" defer></script>
  <script src="js/core.js" defer></script>
  <script src="js/tasks.js" defer></script>
  <script src="js/expenses.js" defer></script>
  <script src="js/plan3d.js" defer></script>
  <script src="js/plan.js" defer></script>
  <script src="js/obra.js" defer></script>
  <script src="js/dashboard.js" defer></script>
  <script src="js/app.js" defer></script>
</body>
</html>
